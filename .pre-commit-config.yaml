repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.7
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Hard block commits that modify files under ruleset/ or test/
  - repo: local
    hooks:
      - id: block-protected-paths
        name: Block edits to protected paths (ruleset/, test/)
        entry: python bin/precommit_block_protected.py
        language: system
        pass_filenames: false
