        time_min: 6
        cpu_pct_est: 25
        ram_mb_est: 128

  - id: ml_engineering
    name: ML Engineering (HF/transformers)
    safety_level: medium
    default_strategies: [ace]
    notes: "Adapters, quantization tradeoffs, reproducibility."
    skills:
      - id: ml-adapters
        title: "LoRA config exploration under budget"
