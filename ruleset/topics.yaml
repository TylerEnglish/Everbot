# New structured registry for curriculum/auto-expansion (single, consistent schema)
topics:
  # ---- Self-optimization lane ----
  - id: selfopt/perf
    name: Performance Profiling & Hotspot Rewrites
    safety_level: low
    default_strategies: [ace, vanilla]
    notes: >
      Profile, A/B, then propose drop-in rewrites behind stable interfaces.
      Must keep functional equivalence and pass root tests.
    skills:
      - id: perf-pyspy
        title: "py-spy guided hotspot identification"
        est_gain: 0.35
        risk_regression: 0.03
        time_min: 6
        cpu_pct_est: 20
        ram_mb_est: 64
      - id: perf-ab
        title: "A/B a rewritten module (same I/O)"
        est_gain: 0.30
        risk_regression: 0.04
        time_min: 7
        cpu_pct_est: 25
        ram_mb_est: 96

  - id: selfopt/memory
    name: Memory Footprint & Cache Hygiene
    safety_level: low
    default_strategies: [ace, vanilla]
    notes: >
      Reduce peak RSS, tune batch sizes, reuse buffers, ensure no leaks.
    skills:
      - id: mem-peak
        title: "Reduce peak RSS by X% on rag pipeline"
        est_gain: 0.28
        risk_regression: 0.04
        time_min: 8
        cpu_pct_est: 25
        ram_mb_est: 96
      - id: mem-bufs
        title: "Buffer reuse & pool sizing"
        est_gain: 0.24
        risk_regression: 0.03
        time_min: 6
        cpu_pct_est: 20
        ram_mb_est: 64

  - id: selfopt/latency
    name: Tail Latency & Concurrency
    safety_level: low
    default_strategies: [ace, vanilla]
    notes: >
