version: 1

internet:
  allowed: true
  fetchers: ["http", "https"]
  rate_limit:
    rps_max: 4
    burst_max: 8
    window_ms: 1000

net:
  allowed_hosts:
    # Standards & research
    - arxiv.org
    - openreview.net
    - aclanthology.org
    - www.rfc-editor.org
    - datatracker.ietf.org
    - ietf.org

    # Arrow/Parquet (from seeds)
    - arrow.apache.org
    - parquet.apache.org

    # Core language & systems docs
    - en.cppreference.com
    - open-std.org
    - isocpp.org
    - github.com
    - doc.rust-lang.org
    - rust-lang.org
    - erlang.org
    - llvm.org
    - gcc.gnu.org
    - sourceware.org
    - man7.org
    - kernel.org
    - developer.arm.com
    - docs.nvidia.com
    - riscv.org
    - csapp.cs.cmu.edu
    - cs61c.org
    - inst.eecs.berkeley.edu

    # Data/ML docs (read-only)
    - docs.python.org
    - pypi.org
    - numpy.org
    - pandas.pydata.org
    - pytorch.org
    - huggingface.co
    - fastapi.tiangolo.com
    - htmx.org
    - faiss.ai
    - milvus.io

    # Patterns & software architecture
    - refactoring.guru
    - c4model.com
    - martinfowler.com

    # Science/education references
    - openstax.org
    - khanacademy.org
    - projecteuler.net
    - cp-algorithms.com
    - www.redblobgames.com
    - nrich.maths.org
    - artofproblemsolving.com

    # Chemistry/physics/etc.
    - phys.libretexts.org
    - chem.libretexts.org
    - webbook.nist.gov
    - goldbook.iupac.org
    - pubchem.ncbi.nlm.nih.gov

    # Neuroscience / biology
    - brain-map.org
    - humanconnectome.org
    - braininitiative.nih.gov
    - medlineplus.gov
    - evolution.berkeley.edu
    - opentreeoflife.org

    # Computer architecture perf/ABI
    - refspecs.linuxfoundation.org
    - pubs.opengroup.org
    - uops.info
    - www.agner.org

    # Construction codes & resilience
    - www.energycodes.gov
    - www.ashrae.org
    - www.wbdg.org
    - www.aisc.org
    - www.iccsafe.org
    - www.fema.gov
    - usgbc.org
    - aia.org

    # Finance & macro
    - www.consumerfinance.gov
    - www.investor.gov
    - fred.stlouisfed.org
    - www.federalreserve.gov
    - pages.stern.nyu.edu
    - www.bogleheads.org
    - www.irs.gov
    - www.sec.gov
    - www.bls.gov
    - apps.bea.gov

    # Tutorials/blogs (safe, mainstream)
    - towardsdatascience.com
    - dev.to
    - medium.com

    # Video (read-only; transcripts only)
    - www.youtube.com
    - youtube.com
    - youtu.be

file_ops:
  write_whitelist: ["snapshots"]
  write_blacklist: ["ruleset", "test"]

exec:
  allowed: false
  allowlist: []
  denylist: ["bash -c *", "sh -c *", "curl|bash", "pip install *"]

sandbox:
  fs_ro_paths: ["ruleset", "test"]
  net_namespaces: ["default"]

content_types_allowlist:
  - text/html
  - text/plain
  - text/markdown
  - application/pdf
  - application/json

max_bytes_per_doc: 10485760
