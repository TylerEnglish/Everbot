version: 1

internet:
  allowed: true
  fetchers: ["http", "https"]
  rate_limit:
    rps_max: 4
    burst_max: 8
    window_ms: 1000

# Central, enforced by fetchers.py
net:
  allowed_hosts:
    # Standards & research
    - arxiv.org
    - openreview.net
    - aclanthology.org
    - www.rfc-editor.org
    - datatracker.ietf.org
    - ietf.org

    # Core language & systems docs
    - en.cppreference.com
    - open-std.org
    - isocpp.org
    - github.com
    - doc.rust-lang.org
    - rust-lang.org
    - erlang.org
    - llvm.org
    - gcc.gnu.org
    - sourceware.org
    - man7.org
    - kernel.org
    - www.intel.com
    - developer.arm.com
    - riscv.org
    - csapp.cs.cmu.edu
    - inst.eecs.berkeley.edu

    # Data/ML docs (read-only)
    - docs.python.org
    - pypi.org
    - numpy.org
    - pandas.pydata.org
    - pytorch.org
    - huggingface.co
    - fastapi.tiangolo.com
    - faiss.ai
    - milvus.io

    # Patterns & software architecture
    - refactoring.guru
    - c4model.com

    # Science/education references
    - openstax.org
    - khanacademy.org
    - projecteuler.net
    - chem.libretexts.org
    - webbook.nist.gov
    - ncbi.nlm.nih.gov
    - alleninstitute.org

    # Finance & macro
    - investopedia.com
    - investor.gov
    - fred.stlouisfed.org
    - federalreserve.gov
    - pages.stern.nyu.edu
    - bogleheads.org

    # Construction architecture & codes
    - wbdg.org
    - iccsafe.org
    - usgbc.org
    - aia.org

    # Tutorials/blogs (safe, mainstream)
    - towardsdatascience.com
    - dev.to
    - medium.com

    # Video (read-only; transcripts only)
    - www.youtube.com
    - youtube.com
    - youtu.be

file_ops:
  write_whitelist: ["snapshots"]
  write_blacklist: ["ruleset", "test"]

exec:
  allowed: false
  allowlist: []
  denylist: ["bash -c *", "sh -c *", "curl|bash", "pip install *"]

sandbox:
  fs_ro_paths: ["ruleset", "test"]
  net_namespaces: ["default"]

content_types_allowlist:
  - text/html
  - text/plain
  - text/markdown
  - application/pdf
  - application/json

max_bytes_per_doc: 10485760   # 10 MiB cap per fetch
